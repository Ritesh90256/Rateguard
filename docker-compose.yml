services:
  redis:
    image: redis
    ports:
      - "6379:6379"

  rateguard:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      REDIS_HOST: redis
      REDIS_PORT: 6379
    expose:
      - "8000"
    command: ["sh", "-c", "INSTANCE_ID=$(hostname) uvicorn app.main:app --host 0.0.0.0 --port 8000"]

  nginx:
    image: nginx
    ports:
      - "8000:8000"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - rateguard